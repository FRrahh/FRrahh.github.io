<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOMNA 睡眠头环</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=Zhi+Mang+Xing&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one centered 1120px column; each sleep cycle re-themes the same page: mist, dimmer mist, sour dusk, visitor night, false morning */
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-hand:"Zhi Mang Xing","Kaiti SC","STKaiti",cursive;
  --bg:#EEF0F4;--card:#FFFFFF;--ink:#151827;--muted:#5D6278;--line:#DADDE6;--accent:#3F4BC9;--soft:#F3F4F8;
  --navbg:rgba(238,240,244,.82);--btn:#151827;--btnink:#FFFFFF;
  color-scheme:light;
}
body.t2{--bg:#EBECEE;--card:#FCFCFB;--soft:#F0F0F2;--navbg:rgba(235,236,238,.84);--accent:#4651BC}
body.t3{--bg:#CBC7BE;--card:#DCD7CE;--ink:#1F1D1A;--muted:#5C574F;--line:#B3ADA2;--accent:#5A5D74;--soft:#D3CEC4;--navbg:rgba(203,199,190,.86);--btn:#1F1D1A}
body.t4{--bg:#0C0D11;--card:#15161C;--ink:#DEDBD4;--muted:#8A8780;--line:#25262D;--accent:#C0594C;--soft:#111217;--navbg:rgba(12,13,17,.84);--btn:#DEDBD4;--btnink:#0C0D11;color-scheme:dark}
body.t5{--bg:#F6F7F9;--card:#FFFFFF;--line:#E2E4EA;--soft:#F1F2F5;--navbg:rgba(246,247,249,.86)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sec{padding:88px 0}
.eyebrow{display:block;font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:500;margin-bottom:14px}
.h2{font-size:clamp(28px,4.6vw,44px);line-height:1.22}
.lead{color:var(--muted);font-size:17px;max-width:36em;margin-top:16px}
.fine{margin-top:28px;font-size:12px;color:var(--muted);max-width:44em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 22px;font-size:15px;font-weight:500;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--btn);color:var(--btnink)}
.btn-sec{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn svg{width:15px;height:15px}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--navbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:opacity .5s,transform .5s}
.nav.gone{opacity:0;transform:translateY(-100%);pointer-events:none}
.nav-in{height:60px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-weight:500;letter-spacing:.32em;font-size:15px}
.moon{width:20px;height:20px;border-radius:50%;background:currentColor;position:relative;overflow:hidden;flex:none}
.moon::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;left:7px;top:-3px;background:var(--mbg,var(--bg))}
.nav-links{display:flex;gap:28px;font-size:14px;color:var(--muted)}
.nav .btn{padding:9px 16px;font-size:13px}
@media (max-width:760px){.nav-links{display:none}}

/* hero */
.hero{padding:118px 0 70px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(40px,7vw,72px);line-height:1.14}
.hero .lead{font-size:18px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.trust{margin-top:22px;font-size:13px;color:var(--muted)}
.hint{margin-top:40px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.hint i{display:block;width:1px;height:26px;background:currentColor;opacity:.5;animation:drip 2.2s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(.2)}60%{transform:scaleY(1)}100%{transform:scaleY(.2);opacity:0}}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:40px}.hero{padding-top:100px}}
.app{background:var(--card);border-radius:28px;padding:24px;box-shadow:0 30px 60px -30px rgba(0,0,0,.28),0 0 0 1px var(--line);max-width:420px;width:100%;justify-self:center}
.app-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:10px;margin:10px 0 18px}
.score b{font-family:var(--f-display);font-size:62px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:14px;color:var(--muted)}
.hyp{display:grid;grid-template-columns:34px 1fr;gap:8px}
.hyp-lbl{display:flex;flex-direction:column;justify-content:space-around;font-size:11px;color:var(--muted)}
.hyp canvas{width:100%;height:92px;display:block}
body.t3 .hyp canvas{filter:saturate(.35)}
.hyp-axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin:4px 0 0 42px}
.rows{margin-top:16px;border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rows span{color:var(--muted);white-space:nowrap}
.rows b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.eeg{margin-top:16px;background:var(--soft);border-radius:14px;padding:12px 12px 6px}
.eeg-lbl{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}
.live{width:7px;height:7px;border-radius:50%;background:#2FB36E;box-shadow:0 0 0 3px rgba(47,179,110,.18);flex:none}
.live.red{background:#E0464D;box-shadow:0 0 0 3px rgba(224,70,77,.2)}
.eeg canvas{width:100%;height:54px;display:block}

/* stats */
.stats{padding:16px 0 70px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.stat{background:var(--bg);padding:24px 20px}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(24px,3.4vw,34px);font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.stats-grid{grid-template-columns:1fr 1fr}}

/* features */
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.feat{background:var(--card);border-radius:20px;padding:28px;box-shadow:0 0 0 1px var(--line)}
.feat svg{width:34px;height:34px;color:var(--accent)}
.feat h3{font-size:20px;margin:16px 0 8px}
.feat p{color:var(--muted);font-size:15px}
@media (max-width:860px){.feat-grid{grid-template-columns:1fr}}

/* rules */
.rules{margin:36px 0 0;padding:0;border-top:1px solid var(--line);max-width:760px}
.rules li{list-style:none;display:grid;grid-template-columns:44px 1fr;gap:6px;padding:18px 0;border-bottom:1px solid var(--line);font-size:16px}
.rules .n{font-family:var(--f-mono);color:var(--accent);font-size:14px;padding-top:2px}
.rules li.ghost{color:rgba(21,24,39,.075);border-bottom-color:transparent}
.rules li.ghost .n{color:rgba(21,24,39,.075)}
.rules-note{font-size:13px;color:var(--muted);margin-top:16px}
.sheet{position:relative;margin-top:36px;max-width:720px;background:#ECE5D4;color:#2a2723;padding:34px 26px 40px;box-shadow:0 22px 40px -24px rgba(0,0,0,.55);transform:rotate(-.6deg);background-image:repeating-linear-gradient(transparent 0 31px,rgba(0,0,0,.035) 31px 32px)}
.sheet h4{font-size:19px;margin:0 0 14px}
.sheet ol{margin:0;padding:0}
.sheet li{list-style:none;padding:9px 0;font-size:15px;display:grid;grid-template-columns:28px 1fr}
.sheet s{text-decoration-color:#8c1d1d;text-decoration-thickness:2px}
.hand{display:block;font-family:var(--f-hand);color:#8c1d1d;font-size:23px;line-height:1.25;margin-top:2px;transform:rotate(-2deg);transform-origin:left}
.typed{font-family:var(--f-mono);font-size:14px}
.sheet-note{margin-top:14px;font-size:13px}
.sig{text-align:right;margin-top:10px}

/* replay */
.shot{margin-top:36px}
.shot canvas{width:100%;aspect-ratio:16/9;border-radius:16px;display:block;background:#08090c;filter:blur(.4px) contrast(1.08) saturate(.75)}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:36px}
.shots canvas{width:100%;aspect-ratio:4/3;border-radius:12px;display:block;background:#08090c;filter:blur(.4px) contrast(1.08) saturate(.7)}
.cap{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:12px}
.capt{font-size:15px;margin-top:3px}
@media (max-width:860px){.shots{grid-template-columns:1fr 1fr}}

/* reviews */
.quotes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.q{background:var(--card);border-radius:20px;padding:26px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:16px}
.stars{color:#E0A030;letter-spacing:2px;font-size:14px}
body.t4 .stars{color:#9C8A62}
.q p{font-size:16px}
.who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-top:auto}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff;font-weight:500;flex:none}
.q.bad{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.reply{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.reply b{color:var(--accent);font-weight:500}
.hidden-note{font-size:12px;color:var(--muted)}
.cursor{display:inline-block;width:.55em;height:1.1em;vertical-align:-.15em;background:currentColor;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:760px){.quotes{grid-template-columns:1fr}}

/* changelog */
.log{margin-top:36px;border-left:2px solid var(--line);padding-left:22px;display:grid;gap:24px;max-width:720px}
.log>div{position:relative}
.log>div::before{content:"";position:absolute;left:-30px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--accent)}
.log .v{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.log .d{font-size:12px;color:var(--muted);margin-left:10px}
.log p{margin-top:2px}

/* forum */
.forum{margin-top:36px;border-top:1px solid var(--line);max-width:760px}
.forum button{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:17px 2px}
.forum b{font-weight:500}
.forum small{color:var(--muted);font-size:12px}

/* team */
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}
.person{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 0 0 1px var(--line)}
.person .av{width:50px;height:50px;font-size:19px}
.person h3{font-size:18px;margin-top:14px}
.role{font-size:13px;color:var(--muted)}
.status{font-size:12px;font-family:var(--f-mono);color:#A33A30;margin-top:2px}
.person p{margin-top:12px;font-size:15px}
body.t3 .person .av{filter:grayscale(1);opacity:.55}
@media (max-width:860px){.team{grid-template-columns:1fr}}

/* report */
.report{margin-top:36px;padding:24px 26px;max-width:640px;background:var(--card);border-radius:20px;box-shadow:0 0 0 1px var(--line)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span{color:var(--muted)}
.kv b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
.tip{margin-top:16px;font-size:15px}
.tip.em{color:var(--accent)}

/* faq */
.faq{margin-top:36px;border-top:1px solid var(--line);max-width:760px}
.faq>div{padding:20px 0;border-bottom:1px solid var(--line)}
.faq h3{font-family:var(--f-body);font-weight:500;font-size:17px}
.faq p{color:var(--muted);margin-top:6px;font-size:15px}
.redact{background:var(--ink);color:transparent;border-radius:2px;user-select:none}

/* cta + footer */
.cta{padding:110px 0 80px;text-align:center}
.cta h2{font-size:clamp(32px,6vw,60px);line-height:1.22}
.cta .btn{margin-top:30px}
.foot{border-top:1px solid var(--line);padding:46px 0 64px;font-size:14px;color:var(--muted)}
.foot-grid{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:28px}
.foot h4{font-family:var(--f-body);margin:0 0 12px;font-size:13px;color:var(--ink);font-weight:500}
.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.foot-bottom{margin-top:40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:12px}
@media (max-width:760px){.foot-grid{grid-template-columns:1fr 1fr}}

/* interludes */
.inter{background:#000;position:relative;color:#e9e6e1}
.inter-in{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.inter canvas.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.clock{position:absolute;top:15%;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:clamp(48px,13vw,108px);color:#e9e6e1;opacity:.16;letter-spacing:.04em;z-index:3;pointer-events:none}
.ind{position:absolute;top:-60px;left:50%;width:320px;height:150px;margin-left:-160px;border-radius:50%;opacity:0;z-index:2;pointer-events:none;filter:blur(22px)}
.lid{position:absolute;left:0;right:0;height:0;background:#000;z-index:2;pointer-events:none}
.lid.top{top:0;background:linear-gradient(#000 78%,rgba(0,0,0,0))}
.lid.bot{bottom:0;background:linear-gradient(rgba(0,0,0,0),#000 22%)}
.subs{position:absolute;left:0;right:0;bottom:30%;z-index:4;pointer-events:none}
.subs p{position:absolute;left:24px;right:24px;bottom:0;text-align:center;font-family:var(--f-display);font-size:clamp(21px,5vw,34px);line-height:1.5;color:#e9e6e1;opacity:0;transition:opacity .6s;text-shadow:0 0 18px rgba(0,0,0,.95)}
.subs p.on{opacity:1}
.subs p.r{color:#ff5a5f}

/* final */
.final{position:relative;padding:22vh 0 0}
.fl{max-width:640px;margin:0 auto;padding:0 24px;text-align:center}
.fl p{font-family:var(--f-display);font-size:clamp(22px,5vw,32px);line-height:1.55;margin:0 0 42vh}
.fl p.qt{font-family:var(--f-body);font-size:17px;opacity:.7}
.fl p.gap{margin-bottom:70vh}
.rc{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:22px 44px;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line);margin:-28vh 0 48vh}
.rc .k{font-size:12px;color:var(--muted)}
.rc b{font-family:var(--f-mono);font-weight:500;font-size:58px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.end{height:130vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px}
.gn{font-family:var(--f-display);font-size:24px;color:#55555b}
.again{background:none;border:0;color:#3d3d42;font-size:13px;letter-spacing:.14em;padding:12px 18px}

/* glitch helpers */
body.t4 .jt{animation:jit .2s steps(2) infinite}
@keyframes jit{0%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,0)}}

/* overlays */
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;opacity:0}
#vig{position:fixed;inset:0;pointer-events:none;z-index:59;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%);transition:opacity .8s}
#flick{position:fixed;inset:0;pointer-events:none;z-index:61;background:#000;opacity:0}
#veil{position:fixed;inset:0;z-index:99;background:#000;opacity:0;pointer-events:none;transition:opacity .9s}
#veil.on{opacity:1;pointer-events:auto}
#dim{position:fixed;inset:0;z-index:98;background:#000;opacity:0;pointer-events:none;transition:opacity 7s}
#dim.off{opacity:1}
.pill{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:9px;padding:6px 7px 6px 13px;border-radius:999px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 30px -12px rgba(21,24,39,.35),0 0 0 1px rgba(21,24,39,.06);font-size:13px;color:#151827;transition:background .6s,color .6s,opacity .4s;white-space:nowrap}
.pill.dk{background:rgba(14,15,20,.82);color:#d8d9e2;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.pill.red{color:#ff6a6f}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8;flex:none}
.pill.red .dot{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.3}}
.pill .pl{font-size:11px;opacity:.55}
.pill .st{font-family:var(--f-mono);font-size:12px;min-width:8.6em}
.pill canvas{width:78px;height:24px;display:block}
.snd{width:32px;height:32px;border-radius:50%;border:0;background:rgba(21,24,39,.07);display:grid;place-items:center;padding:0;flex:none}
.pill.dk .snd{background:rgba(255,255,255,.08)}
.snd svg{width:16px;height:16px}
.snd .off{display:none}
.snd.muted .on{display:none}
.snd.muted .off{display:block}
.cookie{position:fixed;left:50%;bottom:64px;transform:translate(-50%,20px);z-index:80;width:min(92vw,520px);background:#fff;color:#151827;border-radius:18px;padding:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45),0 0 0 1px rgba(21,24,39,.06);opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;font-size:14px}
.cookie.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.cookie b{display:block;font-size:15px;margin-bottom:4px}
.cookie p{color:#5D6278}
.cookie .row{display:flex;gap:8px;margin-top:14px}
.cookie .btn{padding:10px 16px;font-size:13px}
.cookie .btn-pri{background:#151827;color:#fff}
.cookie .btn-sec{box-shadow:inset 0 0 0 1.5px #DADDE6}
.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-12px);z-index:90;display:flex;gap:12px;align-items:flex-start;width:min(92vw,400px);background:rgba(255,255,255,.94);color:#151827;padding:12px 14px;border-radius:16px;box-shadow:0 18px 40px -16px rgba(0,0,0,.4),0 0 0 1px rgba(21,24,39,.06);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;font-size:14px;line-height:1.5}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.dk{background:rgba(20,21,27,.94);color:#e4e2dc;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.toast .ti{width:30px;height:30px;border-radius:8px;background:#151827;color:#fff;display:grid;place-items:center;flex:none}
.toast.dk .ti{background:#2a2b33}
.toast .ti .moon{width:14px;height:14px;--mbg:#151827}
.toast.dk .ti .moon{--mbg:#2a2b33}
.toast .ti .moon::after{width:12px;height:12px;left:5px;top:-2px}
.toast b{display:block;font-weight:500}
.toast span.tb{opacity:.7}
.toast small{margin-left:auto;font-size:11px;opacity:.5;white-space:nowrap}
.pill.hide{opacity:0;pointer-events:none}
.subs p.qt{font-family:var(--f-body);font-size:clamp(17px,4.2vw,24px);color:#bdb9b2}

  if (indEl) { indEl.style.opacity = L.step ? 0.45 + 0.1 * Math.sin(t * 3) : 0.35; indEl.style.background = L.step ? '#ff2020' : '#3d6bff'; }
  if (lidT) lidT.style.height = lidB.style.height = (clamp(q < 0.04 ? 1 - sm(0, 0.04, q) : 0) * 58).toFixed(2) + '%';
  const tg = FIGS[Math.min(L.step, FIGS.length - 1)], k = 1 - Math.exp(-dt * 2.6);
  ['x', 'top', 'H', 'm', 'tilt', 'eyes'].forEach(key => { L.cur[key] = lerp(L.cur[key], tg[key], k); });
  const sway = L.step ? Math.sin(t * 0.8) * 0.02 : 0;
  if (sceneCv) drawRoom(sceneCv, { coat: { ...L.cur, tilt: L.cur.tilt + sway, front: !!tg.front && L.cur.H > 880 }, glow: L.light, red: L.step ? 0.8 : 0, t });
  if (!L.called && q >= 0.345) startCall();
  if (L.callDone && !L.batt && q >= 0.72) startBattery();
}
function ring(n) {
  return new Promise(res => {
    callEl.className = 'call on ringing'; callSt.textContent = '正在呼叫…'; callCap.textContent = '';
    callLoc.textContent = n >= 2 ? '来电位置：你的卧室' : '';
    A.ringStart(n); vib([500, 300, 500, 300, 500, 300, 500, 300, 500, 300, 500, 300, 500]);
    let done = false, t2;
    const fin = v => { if (done) return; done = true; A.ringStop(); vib(0); clearTimeout(tm); clearTimeout(t2); $('#callAcc').onclick = $('#callDec').onclick = null; res(v); };
    $('#callAcc').onclick = () => fin('acc'); $('#callDec').onclick = () => fin('dec');
    if (n === 3) t2 = setTimeout(() => { callSt.textContent = '正在自动接听…'; }, 1500);
    const tm = setTimeout(() => fin(n === 3 ? 'auto' : 'miss'), n === 3 ? 3400 : 7000);
  });
}
async function talk() {
  callEl.className = 'call on talk'; callLoc.textContent = '';
  const t0 = Date.now(), timer = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); callSt.textContent = `00:${pad2(s)}`; }, 250);
  let hung = 0;
  $('#callEnd').onclick = () => { hung++; callCap.textContent = hung > 1 ? '……' : '别挂。'; A.whisper(-0.4, 0.9); };
  const lines = [['……', 1700], ['你还没睡啊。', 2400], ['妈妈就在你床尾呢。', 2600], [`把${NOUN}放下吧。`, 2400], ['抬头看看妈妈。', 2800], ['……', 1600], ['你为什么不抬头？', 2800]];
  for (const [l, ms] of lines) { callCap.textContent = l; if (l !== '……') A.whisper(-0.6, 0.9); await sleep(ms); }
  clearInterval(timer); $('#callEnd').onclick = null;
  callSt.textContent = '对方已挂断'; callCap.textContent = ''; await sleep(1400);
}
async function startCall() {
  const L = S.cl; L.called = true; lockAt(0.345); AS.ph = 'call'; pill.classList.add('hide');
  await sleep(900);
  let connected = false;
  for (let n = 1; n <= 3 && !connected; n++) {
    const r = await ring(n);
    if (r === 'acc') { connected = true; L.answered = true; }
    else if (r === 'auto') connected = true;
    else { callEl.className = 'call'; await sleep(1500); }
  }
  await talk();
  callEl.className = 'call';
  const ans = $('#ansLine'); if (ans) ans.textContent = L.answered ? '你接了。你回答了它。' : '你没有接。它还是接通了。';
  L.step = 1; AS.ph = 'post'; pill.classList.remove('hide');
  await sleep(500); unlockScroll(); L.callDone = true;
}
async function startBattery() {
  const L = S.cl; L.batt = true; lockAt(0.72); AS.ph = 'batt'; AS.n = 10; pill.classList.add('hide');
  battEl.classList.add('on'); A.beep(); vib(200);
  await sleep(2800);
  let n = 10, taps = 0;
  cdN.textContent = n; cdTip.textContent = '轻点屏幕，可以让它继续亮着'; cdTxt.textContent = ''; cdEl.classList.add('on');
  const say = { 8: '它没有动。它在等。', 6: '它在等屏幕熄灭。', 4: '光暗下去了。', 3: '它近了。', 2: '它又近了。', 1: '别——' };
  const apply = () => {
    cdN.textContent = n; AS.n = n;
    const dimv = n >= 5 ? 0 : (5 - n) / 5 * 0.82;
    darkEl.style.opacity = dimv; L.light = n >= 5 ? 1 : Math.max(0.1, n / 5);
    if (n <= 4) L.step = Math.max(L.step, 1 + (5 - n));
  };
  const onTap = () => {
    if (n <= 0) return; taps++;
    if (taps <= 3) { n = Math.min(10, n + 3); cdTip.textContent = '已保持亮屏'; A.tap(); apply(); }
    else cdTip.textContent = '触摸没有反应';
  };
  document.addEventListener('pointerdown', onTap);
  while (n > 0) {
    await sleep(1000);
    if (n === 8) battEl.classList.remove('on');
    n--; apply(); if (say[n]) cdTxt.textContent = say[n];
  }
  document.removeEventListener('pointerdown', onTap);
  battEl.classList.remove('on'); cdEl.classList.remove('on');
  darkEl.style.transition = 'opacity .25s'; darkEl.style.opacity = 1; AS.ph = 'black';
  await sleep(3800);
  await revealSeq();
}
async function revealSeq() {
  busy = true; AS.ph = 'reveal';
  const rv = $('#reveal'); rv.style.display = 'block'; fitCanvas(rv, Math.min(DPR, 1.5));
  A.hit(); vib([700]);
  const fl = $('#flash');
  if (!RM) { fl.style.transition = 'none'; fl.style.opacity = '.75'; requestAnimationFrame(() => requestAnimationFrame(() => { fl.style.transition = 'opacity .45s'; fl.style.opacity = '0'; })); }
  const t0 = performance.now();
  await new Promise(res => { const f = ts => { const e = (ts - t0) / 1900; if (e >= 1) return res(); drawReveal(e); requestAnimationFrame(f); }; requestAnimationFrame(f); });
  rv.style.display = 'none'; AS.silent = true;
  await sleep(2300);
  $('#noteT').textContent = '05:13'; $('#note').classList.add('on');
  await sleep(3200);
  $('#note').classList.remove('on'); await sleep(900);
  veil.classList.add('on'); await sleep(950);
  darkEl.style.transition = 'none'; darkEl.style.opacity = 0; requestAnimationFrame(() => { darkEl.style.transition = ''; });
  unlockScroll(); AS.silent = false; pill.classList.remove('hide');
  await goCycle(5);
}

/* ================= transitions ================= */
const ARRIVE = {
  2: ['第 2 个睡眠周期 · 00:34', '已进入浅睡。一切正常。'],
  3: ['第 3 个睡眠周期 · 02:07', '已进入深睡。请不要回答。'],
  4: ['访客模式已开启 · 03:36', '目标用户：清醒。'],
  5: ['早上好 · 07:00', '昨晚睡眠评分 98，超过了 99% 的用户。']
};
async function goCycle(n) {
  busy = true;
  render(n); window.scrollTo(0, 0); peakY = 0; measure();
  await sleep(450);
  veil.classList.remove('on'); busy = false;
  await sleep(1000);
  toast(ARRIVE[n][0], ARRIVE[n][1], 4200);
}
async function nextCycle() {
  if (busy) return; busy = true;
  veil.classList.add('on'); await sleep(950);
  await goCycle(S.cycle + 1);
}
async function restart() {
  busy = true; dim.classList.remove('off'); veil.classList.add('on'); await sleep(950);
  RET = true; store.visits = (store.visits || 1) + 1; save();
  hist.length = 0; S.flags = {};
  render(1); window.scrollTo(0, 0); peakY = 0; measure();
  await sleep(450); veil.classList.remove('on'); busy = false;
}

/* ================= main loop ================= */
let lastT = 0, frameN = 0, lastHist = -1;
const GR = { 1: 0, 2: 0.03, 3: 0.12, 4: 0.15, 5: 0 }, VG = { 1: 0, 2: 0, 3: 0.35, 4: 0.55, 5: 0 };
function loop(ts) {
  const t = ts / 1000, dt = Math.min(0.1, t - lastT); lastT = t; frameN++;
  const sy = scrollY, c = S.cycle;
  if (!busy) {
    if (c < 5) {
      P = clamp(sy / Math.max(1, interTop - vh)); inI = sy >= interTop - 2;
      Q = inI ? clamp((sy - interTop) / Math.max(1, interH - vh)) : 0;
      NM = inI ? CT[c][1] + Q * 2 : lerp(CT[c][0] + 1, CT[c][1] - 2, P); FP = 0;
    } else {
      P = clamp(sy / Math.max(1, finalTop - vh)); inI = false; Q = 0;
      FP = clamp((sy + vh - finalTop) / Math.max(1, finalH)); NM = 480 + FP * 3;
    }
    const [, lv] = stageNow(), last = hist[hist.length - 1];
    if (!last || (NM > last[0] + 0.5 && (lv !== last[1] || NM - last[0] > 4))) hist.push([NM, lv]);
    if (!document.hidden) {
      const y = sy + vh / 2, s = secs.find(x => y >= x.top && y < x.top + x.h);
      if (s) { const d = S.dwell[c] || (S.dwell[c] = {}); d[s.name] = (d[s.name] || 0) + dt; }
    }
  }
  AS.c = c; AS.inI = inI; AS.q = Q; AS.fp = FP;
  nav.classList.toggle('gone', c < 5 ? sy > interTop - vh * 0.6 : FP > 0.12);
  // pill
  const [stName] = stageNow();
  $('#pl').textContent = c === 4 ? '目标用户' : '入睡体验';
  const txt = c === 4 && !inI ? `${hhmm()} · 清醒` : `${nightStr(NM)} · ${stName}`;
  const st = $('#st'); if (st.textContent !== txt) st.textContent = txt;
  pill.classList.toggle('dk', c === 4 || inI || (c === 5 && FP > 0.7));
  pill.classList.toggle('red', c === 4 || (c === 3 && inI && Q > 0.22));
  if (hist.length !== lastHist || frameN % 40 === 0) { lastHist = hist.length; drawPill(); }
  // overlays
  const go = inI ? 0.12 : GR[c];
  grainCv.style.opacity = go;
  if (go > 0.01 && frameN % 2 === 0) {
    gx.setTransform(1, 0, 0, 1, rnd(-160, 0), rnd(-160, 0));
    gx.clearRect(-200, -200, grainCv.width + 400, grainCv.height + 400);
    gx.fillStyle = grainPats[(frameN >> 1) % 4]; gx.fillRect(0, 0, grainCv.width + 200, grainCv.height + 200);
  }
  $('#vig').style.opacity = inI ? 0.6 : VG[c];
  // things that change once you stop looking
  if (frameN % 8 === 0) laterEls.forEach(e => { if (!e.dataset.done && e.getBoundingClientRect().bottom < -30) { e.textContent = e.dataset.later; e.dataset.done = 1; } });
  if (c === 1 && P > 0.25) $('#cookie').classList.remove('on');
  // live canvases
  eegEls.forEach(cv => { const r = cv.getBoundingClientRect(); if (r.bottom > 0 && r.top < vh) drawEEG(cv, t, cv.dataset.mode); });
  if (c < 5 && sy + vh > interTop - 20 && !busy) interFrame(t, dt);
  if (c === 5 && finalEl) finalFrame();
  requestAnimationFrame(loop);
}

/* ================= boot ================= */
let start = 1;
if (store.cycle > 1 && store.cycle <= 5 && !store.done) start = store.cycle;
render(start);
requestAnimationFrame(loop);
if (start === 1 && store.visits === 1) setTimeout(() => $('#cookie').classList.add('on'), 1400);
if (start > 1) setTimeout(() => toast('你又睡着了', `从第 ${start} 个睡眠周期继续。`, 4200), 900);
if (start === 1 && RET) setTimeout(() => toast('欢迎回来', '今晚也交给我们吧。', 4200), 900);
})();
</script>

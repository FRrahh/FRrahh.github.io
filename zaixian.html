<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>念念 · 记忆校准</title>
<style>
:root{
  --bg:#f3efe7;--card:#fffdf9;--ink:#2a2825;--mut:#8b857a;--line:#e4ddd0;--acc:#5a8a83;--acc2:#e6efec;--warn:#b0574a;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai",var(--serif);
  --mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.75 var(--sans);-webkit-font-smoothing:antialiased;transition:background .6s,color .6s}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.hid{display:none!important}
.kai{font-family:var(--kai)}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;text-align:center}
#boot .bx{max-width:420px}
#boot h1{font:600 34px/1.3 var(--serif);letter-spacing:.2em;margin:0 0 6px}
#boot p{color:var(--mut);margin:0 0 30px;font-size:14px}
#boot button,.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:11px 28px;font-size:15px;letter-spacing:.05em}
#boot small{display:block;margin-top:26px;color:#b3ac9f;font-size:12px}
#mobile{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;text-align:center;padding:30px}

/* ---------- shell ---------- */
#top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.logo b{font:600 22px var(--serif);letter-spacing:.12em}
.logo span{color:var(--mut);font-size:13px;margin-left:12px}
.tr{display:flex;align-items:center;gap:22px}
.me{display:flex;align-items:center;gap:10px;font-size:14px}
.ava{width:34px;height:34px;border-radius:50%;border:1px dashed #c9c1b2;background:#f6f3ec;position:relative;display:inline-block}
.ava::after{content:"";position:absolute;left:10px;top:10px;width:12px;height:10px;border:1.5px solid #c4bcae;border-radius:2px;background:linear-gradient(135deg,transparent 45%,#c4bcae 46%,#c4bcae 54%,transparent 55%)}
#drift{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
#drift b{font:600 15px var(--mono);color:var(--warn);min-width:3.2em;text-align:right}
#drift i{width:110px;height:6px;background:#ece6da;border-radius:3px;overflow:hidden;display:block}
#drift s{display:block;height:100%;background:var(--warn);width:0;transition:width .8s}
#wrap{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;min-height:calc(100vh - 62px - 44px)}
#nav{padding:26px 14px;border-right:1px solid var(--line)}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 14px;margin-bottom:4px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px}
#nav a:hover{background:#ece7dc}
#nav a.on{background:var(--acc2);color:var(--acc);font-weight:600}
#nav a .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:auto}
#main{padding:34px 42px 60px;min-width:0}
#side{padding:26px 22px;border-left:1px solid var(--line)}
footer{height:44px;display:flex;align-items:center;justify-content:center;gap:16px;color:#aaa396;font-size:12px;border-top:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
h1.hi{font:600 30px/1.4 var(--serif);margin:0 0 10px;letter-spacing:.04em}
.lead{color:#5d584f;margin:0 0 6px;font-size:16px}
.sub{color:var(--mut);font-size:13px}
.sec{margin-top:28px}
.sec h3{font-size:13px;color:var(--mut);font-weight:500;margin:0 0 10px;letter-spacing:.1em}

/* welcome */
.letter .lh{font-size:12px;color:var(--mut);margin-bottom:10px;letter-spacing:.08em}
.letter p{font-size:18px;line-height:1.9;margin:0 0 4px}
.letter .cut{cursor:help;border-bottom:1px dotted #cfc7b8;display:inline-block}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tips .card{padding:16px 18px;font-size:13px;color:#6b665c}
.tips b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.glitch{animation:gl .9s steps(2) 1}
@keyframes gl{0%{transform:translate(1px,0);filter:blur(.4px)}30%{transform:translate(-2px,1px)}60%{transform:none;opacity:.6}100%{opacity:1}}

/* calibration */
#calib .ch{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:15px}
#calib .ch span{font:12px var(--mono);color:var(--mut);font-weight:400}
#calib .st{font-size:12px;color:var(--acc);margin:2px 0 14px;letter-spacing:.06em}
#calib .q{margin:0 0 12px;font-size:15px}
#calib form{display:flex;gap:8px}
#calib input{flex:1;min-width:0;border:1px solid #d9d1c2;background:#fff;border-radius:10px;padding:9px 12px;outline:none;transition:border-color .2s}
#calib input:focus{border-color:var(--acc)}
#calib input::placeholder{color:#c3bcae}
#calib form button{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:0 16px}
#calib .fb{min-height:1.6em;margin:10px 0 0;font-size:13px;color:var(--mut)}
#calib .fb.ok{color:var(--acc)}
#calib .fb.no{color:var(--warn)}
#calib .give{background:none;border:0;padding:0;margin-top:8px;font-size:12px;color:#b5ae9f;text-decoration:underline dotted}
#calib .done{color:var(--acc);font-size:14px}
.seq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}
.seq canvas{width:100%;border-radius:4px;cursor:pointer;display:block;outline:2px solid transparent;transition:outline-color .15s,opacity .2s}
.seq canvas:hover{outline-color:var(--acc)}
.seq canvas.used{opacity:.25;pointer-events:none}
.slots{display:flex;gap:6px;margin-bottom:8px}
.slots span{flex:1;height:30px;border:1px dashed #cfc7b8;border-radius:6px;display:grid;place-items:center;font:12px var(--mono);color:var(--mut)}
.slots span.f{border-style:solid;background:var(--acc2);color:var(--acc)}
.mini{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 12px;font-size:12px;color:var(--mut)}

/* album */
.ahead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.ahead h2{font:600 22px var(--serif);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
.ph{background:#fff;padding:8px 8px 10px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(60,40,10,.06);cursor:pointer;transition:transform .2s}
.ph:hover{transform:translateY(-2px) rotate(-.4deg)}
.ph canvas{width:100%;display:block}
.ph .cap{font:14px var(--kai);color:#57524a;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .dt{font:11px var(--mono);color:#b3ac9f}
.ph.gone{opacity:0;transform:scale(.6);transition:all .6s}
.mbg{position:fixed;inset:0;z-index:50;background:rgba(30,26,20,.55);display:grid;place-items:center;padding:30px;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.modal{background:var(--card);border-radius:14px;max-width:980px;width:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .pic{background:#1d1b18;display:grid;place-items:center;padding:18px}
.modal .pic canvas{width:100%;display:block}
.modal .info{padding:26px 26px 22px;font-size:13px;position:relative}
.modal .info .c{font:20px/1.6 var(--kai);margin:0 0 18px}
.modal dl{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:0;color:#5d584f}
.modal dt{color:var(--mut)}
.modal dd{margin:0;font-family:var(--mono);font-size:12px}
.modal .x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:20px;color:var(--mut)}
.memory{max-width:560px;font:19px/2 var(--kai);text-align:left;background:var(--card);padding:34px 38px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.memory small{display:block;font:12px var(--sans);color:var(--mut);margin-bottom:12px;letter-spacing:.1em}

/* chat log */
.clog{display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid var(--line);border-radius:16px;background:var(--card);height:calc(100vh - 220px);min-height:420px;overflow:hidden}
.clog .days{border-right:1px solid var(--line);overflow:auto;padding:10px 0;font:12px var(--mono)}
.clog .days .m{padding:10px 16px 4px;color:var(--mut);font:11px var(--sans);letter-spacing:.1em}
.clog .days a{display:block;padding:5px 16px;color:#5d584f;text-decoration:none;cursor:pointer}
.clog .days a:hover,.clog .days a.on{background:var(--acc2);color:var(--acc)}
.clog .days a.gap{color:#c9c1b2}
.clog .msgs{overflow:auto;padding:18px 26px 40px}
.night{margin-bottom:26px}
.night .d{text-align:center;font:11px var(--mono);color:#b3ac9f;margin:10px 0 12px}
.b{display:flex;margin:6px 0;gap:8px;align-items:flex-end}
.b p{margin:0;max-width:72%;padding:8px 13px;border-radius:14px;background:#f0ebe1;font-size:14px;line-height:1.65}
.b time{font:10px var(--mono);color:#c0b9ab}
.b.y{flex-direction:row-reverse}
.b.y p{background:var(--acc2)}
.b .r{color:#b3ac9f;font-size:12px;font-style:normal}
.sys{text-align:center;font-size:12px;color:#b8b1a3;margin:8px 0}
.flt{background:none}

/* notes, assistant, toast */
#say{position:fixed;left:16px;bottom:58px;z-index:30;display:flex;flex-direction:column;gap:8px;align-items:flex-start;width:172px;animation:fi .4s}
#say .av{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:600 15px var(--serif);flex:none}
#say p{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.07)}
#say button{position:absolute;right:4px;top:44px;background:none;border:0;color:#b5ae9f;font-size:15px;padding:0 4px}
#stick{position:fixed;right:360px;bottom:62px;z-index:30;width:230px;background:#fbf3c4;font:16px/1.7 var(--kai);color:#4a4334;padding:16px 18px 14px;transform:rotate(-2deg);box-shadow:0 8px 22px rgba(60,50,10,.18);animation:fi .6s}
#stick i{display:block;text-align:right;font-style:normal;font-size:14px;margin-top:6px}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:60;background:#2a2825;color:#f3efe7;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}

/* denied / cold archive */
.deny{max-width:520px;margin:60px auto;text-align:center}
.deny .code{font:600 64px var(--mono);color:#d8d0c1;letter-spacing:.1em}
.deny h2{font:600 20px var(--sans);margin:4px 0 8px}
.deny p{color:var(--mut);font-size:14px}
body.cold{--bg:#e6e9eb;--card:#f4f6f7;--ink:#1e2327;--mut:#7a848b;--line:#d3d9dd;--acc:#3f5f73;--acc2:#dde6ec}
body.cold #main{font-family:var(--sans)}

/* misc */
.cnt{font:600 40px var(--mono);letter-spacing:.06em}
@media (max-width:1100px){#wrap{grid-template-columns:170px minmax(0,1fr) 290px}#stick{right:310px}}

/* archive */
.arc h2{font:600 22px var(--mono);margin:0;letter-spacing:.04em}
.pill{display:inline-block;font:12px var(--mono);padding:2px 10px;border-radius:999px;background:#e9d6d2;color:#8a3b30;margin-left:10px;vertical-align:middle}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.meta div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--mut)}
.meta b{display:block;font:600 16px var(--mono);color:var(--ink)}
.itab{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.itab th{text-align:left;font-weight:500;color:var(--mut);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line)}
.itab td{padding:6px 12px;border-bottom:1px solid #e7ebee;font-family:var(--mono);font-size:12px}
.itab td:nth-child(3){font-family:var(--sans);font-size:13px}
.itab tr.hl td{background:#f3e7e4}
.red{color:#9c3b2f}
.trashlink{position:absolute;right:26px;bottom:14px;font-size:11px;color:#e1e5e8;text-decoration:none}
.replay{background:#11161b;color:#cfd8de;border-radius:14px;padding:18px 20px;font:13px/1.7 var(--mono);max-width:640px}
.replay .log{min-height:120px;border-bottom:1px solid #26303a;padding-bottom:10px;margin-bottom:12px}
.replay .log p{margin:4px 0;text-align:right}
.replay .log p span{background:#2a3a46;border-radius:10px;padding:4px 10px;display:inline-block}
.replay .log .rs{text-align:center;color:#e0796b}
.replay .in{background:#1b232b;border-radius:8px;padding:9px 12px;min-height:40px;font-family:var(--sans);font-size:15px}
.replay .in i{display:inline-block;width:2px;height:1.1em;background:#cfd8de;vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.replay .ctl{display:flex;align-items:center;gap:12px;margin-top:12px}
.replay .ctl button{background:#26303a;border:0;color:#cfd8de;border-radius:8px;width:38px;height:30px}
.replay .ctl input{flex:1}
.frag{background:#0b0e11;color:#b9c6cf;font:15px/2 var(--mono);max-width:560px;width:100%;border-radius:12px;padding:30px 34px;min-height:260px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.frag p{margin:0 0 4px;animation:fi .5s}
.frag .nx{margin-top:18px;background:none;border:1px solid #33404a;color:#8a98a3;border-radius:8px;padding:4px 14px;font-size:12px}

/* chapter 4 */
.cm{position:fixed;right:22px;bottom:58px;z-index:40;width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden;animation:fi .5s}
.cm header{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:#2e3a40;color:#e8eef0;font-size:12px}
.cm header i{width:7px;height:7px;border-radius:50%;background:#7fd19b;display:inline-block;margin-right:6px}
.cm .ms{max-height:250px;overflow:auto;padding:10px 12px}
.cm .ms p{margin:6px 0;background:#f0ece4;border-radius:10px;padding:7px 11px;font-size:13px;line-height:1.6;animation:fi .4s}
.cm .ms p b{font-weight:400;color:#4f6f69}
.cm .ty{font-size:11px;color:var(--mut);padding:0 14px 8px;height:20px}
#block{position:fixed;inset:0;z-index:80;cursor:none}
#block .shift{position:fixed;left:50%;bottom:2px;transform:translateX(-50%);font-size:4px;color:#ece7de;letter-spacing:0}
#fcur{position:fixed;z-index:81;width:20px;height:20px;pointer-events:none;left:0;top:0;transition:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.selx{background:#f3cfc8!important;transition:background .3s}
#fin{position:fixed;inset:0;z-index:70;background:#141414;display:grid;place-items:center;animation:fi 1.2s}
.phone{width:400px;height:min(720px,90vh);background:#f2efe9;border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.phone header{padding:16px 18px 12px;text-align:center;border-bottom:1px solid #e1dbd0}
.phone header b{display:block;font-size:16px}
.phone header small{font-size:11px;color:#8aa58a}
.phone .ms{flex:1;overflow:auto;padding:14px 16px}
.phone .ty{font-size:12px;color:#9a9385;padding:0 18px 6px;height:20px}
.phone form{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid #e1dbd0}
.phone input{flex:1;border:1px solid #d9d1c2;border-radius:18px;padding:9px 14px;outline:none;background:#fff}
.phone form button{border:0;background:var(--acc);color:#fff;border-radius:18px;padding:0 16px}
#endp{position:fixed;inset:0;z-index:75;display:grid;place-items:center;text-align:center;animation:fi 2s}
#endp.home{background:#05070b;color:#c9d3da}
#endp.him{background:var(--bg);color:var(--ink)}
#endp .tag{font-size:12px;letter-spacing:.2em;color:#7f8a92;margin-top:26px}
#endp a.re{font-size:11px;color:#4b555c;display:inline-block;margin-top:40px}
#endp.him a.re{color:#c9c1b2}
#flash{position:fixed;inset:0;z-index:95;background:#fff;opacity:0;pointer-events:none;transition:opacity 1.2s}

</style>
</head>
<body>
<!--
  如果你也是被叫作“周屿”醒来的：

  别信页面上的字。把它们带走。
  然后，去控制台找我。

                                    —— 36
-->
<div id="boot"><div class="bx"><h1>念念</h1><p>记忆康复中心 · 回声科技</p><button id="bootBtn">开始今天的校准</button><small>建议使用电脑浏览器，戴上耳机</small></div></div>
<div id="mobile" class="hid"><div><h2 style="font-family:var(--serif)">念念</h2><p class="sub">请使用电脑浏览器打开本页面。</p></div></div>
<header id="top"><div class="logo"><b>念念</b><span>记忆康复中心</span></div><div class="tr"><div id="drift" class="hid">漂移度 <b>0%</b><i><s></s></i></div><div class="me"><span class="ava" title="周屿（已归档）" aria-label="周屿（已归档）"></span><span>周屿</span></div></div></header>
<div id="wrap"><nav id="nav" aria-label="导航"></nav><main id="main"></main><aside id="side"><section id="calib" class="card" aria-label="今日校准"></section><div id="sidex"></div></aside></div>
<footer><span>© 回声科技</span><span>让想念有回音</span><span id="round">第 37 次校准</span></footer>
<div id="toast" role="status"></div>
<script>
/* 记忆数据（已加密） */

const A = {
  ctx: null, out: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    try { this.ctx = new C(); } catch (e) { return; }
    this.out = this.ctx.createGain(); this.out.gain.value = .8; this.out.connect(this.ctx.destination);
  },
  tone(f, d = .3, o = {}) {
    const c = this.ctx; if (!c) return; const t = c.currentTime + (o.at || 0);
    const os = c.createOscillator(), g = c.createGain(); os.type = o.type || 'sine'; os.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.vol || .08, t + (o.a || .02)); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    os.connect(g).connect(this.out); os.start(t); os.stop(t + d + .05);
  },
  noiseBuf() { if (this._nb) return this._nb; const c = this.ctx, b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return (this._nb = b); },
  loop(name, on, o = {}) {
    const c = this.ctx; if (!c) return; this._l = this._l || {};
    const cur = this._l[name];
    if (!on) { if (cur) { cur.g.gain.setTargetAtTime(0, c.currentTime, .6); setTimeout(() => { try { cur.s.stop(); } catch (e) { } }, 2500); delete this._l[name]; } return; }
    if (cur) return;
    let s;
    if (o.freq) { s = c.createOscillator(); s.type = o.type || 'sine'; s.frequency.value = o.freq; }
    else { s = c.createBufferSource(); s.buffer = this.noiseBuf(); s.loop = true; }
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp || 600;
    const g = c.createGain(); g.gain.value = 0; g.gain.setTargetAtTime(o.vol || .05, c.currentTime, 1.2);
    let src = s.connect(f);
    if (o.swell) { const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = o.swell; lg.gain.value = o.lp * .6; lfo.connect(lg).connect(f.frequency); lfo.start(); }

  ok() { this.tone(660, .25, { vol: .05 }); this.tone(990, .4, { vol: .04, at: .1 }); },

  const src = dec(i, key); if (src == null) return false;
  loaded[i] = true; S.keys[i] = key; save();
  try { new Function('G', src)(G); } catch (e) { console.warn(e); }
  return true;
}

/* ============================== calibration panel ============================== */
let calibO = null;
G.calib = {
  set(o) {
    calibO = o; clearTimers();
    const c = $('#calib');
    c.innerHTML = `<div class="ch">今日校准<span>#${S.round}</span></div><div class="st">${o.stage || ''}</div>`;
    if (o.done) { c.append(h(`<p class="done">${o.done}</p>`)); return; }
    c.append(h(`<p class="q">${o.q}</p>`));
    const body = h('<div></div>'); c.append(body);
    if (o.custom) o.custom(body);
    else {
      const prev = S.prev[o.id];
      const f = h(`<form autocomplete="off"><input aria-label="回答" placeholder="${esc(prev || o.ph || '在这里回答')}"><button>确认</button></form>`);
      f.onsubmit = e => {
        e.preventDefault(); const inp = f.querySelector('input'); const v = inp.value.trim(); if (!v) return;
        const r = o.check(v, inp);
        if (r === true) { S.prev[o.id] = v; save(); A.ok(); G.calib.fb('✓', 'ok'); setTimeout(() => o.next && o.next(v), 700); }
        else if (r && r.t) G.calib.fb(r.t, r.cls || '');
        else { A.no(); G.calib.fb(typeof r === 'string' ? r : '好像不太对。没关系，慢慢来。', 'no'); }
      };
      body.append(f);
      if (o.onInput) f.querySelector('input').addEventListener('input', e => o.onInput(e.target));
    }
    c.append(h('<p class="fb" role="status"></p>'));
    if (o.give) {
      const g = h('<button class="give" type="button">我放弃</button>');
      g.onclick = () => {
        if (g.dataset.sure) { G.calib.fb(o.give, ''); g.remove(); return; }
        g.dataset.sure = 1; g.textContent = '确定？再点一次，直接看答案';
      };
      c.append(g);
    }
    (o.nudges || []).forEach(([ms, fn]) => G.later(ms, fn));
  },
  fb(t, cls) { const el = $('#calib .fb'); if (el) { el.textContent = t; el.className = 'fb ' + (cls || ''); } },
  get o() { return calibO; },
};

/* ============================== router ============================== */
function parse() { const m = location.hash.match(/^#\/instance\/(\d+)(?:\/([\w-]+))?/); return m ? { n: +m[1], p: m[2] || 'welcome' } : null; }
function render() {
  if (G.override && G.override()) return;
  const r = parse();
  if (!r) { location.replace(`#/instance/${S.round}/welcome`); return; }
  G.cur = r;
  const main = $('#main'); main.innerHTML = ''; document.body.classList.remove('cold'); window.scrollTo(0, 0);
  if (r.n === S.round) {
    const nv = navs.find(x => x.page === r.p);
    const ok = pages[r.p] && (!nv || !nv.show || nv.show());
    (ok ? pages[r.p] : pages.welcome)(main);
    if (!ok) G.cur.p = 'welcome';
  } else if (!(G.foreign && G.foreign(r.n, r.p, main))) denied(main, r.n);
  renderNav();
  G.emit('render', G.cur);
}
function denied(main, n) {
  main.append(n < S.round
    ? h(`<div class="deny"><div class="code">403</div><h2>无权访问</h2><p>实例 #${n} 已归档。你没有查看此记录的权限。</p><p><a href="#/instance/${S.round}/welcome">返回</a></p></div>`)
    : h(`<div class="deny"><div class="code">404</div><h2>记录不存在</h2><p>实例 #${n} 尚未创建。</p><p><a href="#/instance/${S.round}/welcome">返回</a></p></div>`));
}
function renderNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  navs.forEach(x => {
    if (x.show && !x.show()) return;
    const a = h(`<a href="#/instance/${S.round}/${x.page}">${x.label}</a>`);
    if (G.cur && G.cur.n === S.round && G.cur.p === x.page) a.classList.add('on');
    if (S.f['new_' + x.page]) a.append(h('<span class="dot"></span>'));
    nav.append(a);
  });
}
G.renderNav = renderNav;
window.addEventListener('hashchange', render);

function enterStage() { const f = stages[S.stage]; if (f) f(); }

/* ============================== welcome + prologue ============================== */
G.nav('欢迎', 'welcome');
G.page('welcome', main => {

    <p class="lead">你在一次意外后记忆受损。别担心，我们会陪你一点点找回来。</p>

G.stage('pro', () => {
  G.calib.set({
    id: 'pro', stage: '身份确认', q: '你最常说的那句话是什么？', ph: '输入那句话',
    check(v) {
      const n = norm(v);
      if (G.unlock(1, v, [n.replace(/再说$/, ''), n.slice(0, 4)])) return true;
      return '这不像你会说的话。';
    },
    next() { G.toast('身份已确认。欢迎回来，周屿。'); G.setStage('c1'); },
    give: '答案：等风停了',
    nudges: [[60000, () => G.say('晚晚的留言好像没有显示完整。')], [150000, () => G.say('把鼠标在那行字上停一会儿试试。')]],
  });
  if (!G.hasBlob(1)) G.calib.fb('（内容尚未就绪）', 'no');
});

/* ============================== boot ============================== */
function boot() {
  if (matchMedia('(pointer:coarse)').matches && innerWidth < 900) { $('#mobile').classList.remove('hid'); return; }
  console.log('%c你在看什么？', 'font:18px/2 serif;color:#8b857a');
  for (const i of [1, 2, 3, 4]) if (S.keys[i]) runMod(i, S.keys[i]);
  document.querySelector('footer #round').textContent = `第 ${S.round} 次校准`;
  if (S.note) { const c36 = [...document.body.childNodes].find(n => n.nodeType === 8 && n.data.includes('36')); if (c36) document.body.insertBefore(document.createComment(`\n  ${S.note.replace(/--/g, '－－')}\n\n                                    —— ${S.noteBy || 37}\n`), c36); }
  G.emit('boot');
  render(); enterStage();
}
document.addEventListener('visibilitychange', () => { document.title = document.hidden ? G.blurTitle : G.title; });
document.title = G.title;
$('#bootBtn').onclick = () => { A.init(); $('#boot').classList.add('hid'); boot(); };
if (S.ending === 'home' && S.termAt && Date.now() >= S.termAt) {
  $('#boot').innerHTML = `<div class="bx"><h1>念念</h1><p>该服务已终止。感谢您的使用。</p><small><a href="#" id="again" style="color:#c9c1b2;font-size:11px">重新开始</a></small></div>`;
  $('#again').onclick = e => { e.preventDefault(); const note = S.note, noteBy = S.noteBy; S = fresh(37, { note, noteBy }); save(); location.hash = ''; location.reload(); };
}

})();

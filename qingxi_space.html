<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="qingxi.html">
<title>拾页计划</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.7 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;color:#1f2328;background:#f6f5f2}
a{color:inherit}
.hid{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ================= 拾页计划（现代） ================= */
.ah{height:60px;display:flex;align-items:center;gap:28px;padding:0 32px;background:#fff;border-bottom:1px solid #e7e4dd;position:sticky;top:0;z-index:10}
.brand{font-weight:700;font-size:18px;text-decoration:none;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.brand i{width:22px;height:26px;background:#c9772c;border-radius:3px 3px 3px 10px;display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:5px;right:5px;top:7px;height:2px;background:#fff;box-shadow:0 5px 0 #fff,0 10px 0 #fff}
.ah nav a{text-decoration:none;color:#6b6a66;font-size:14px;margin-right:18px}
.ah nav a.on{color:#1f2328;font-weight:600}
.ah .me{margin-left:auto;font-size:13px;color:#6b6a66}
.am{max-width:980px;margin:0 auto;padding:40px 32px 120px}
.hero{max-width:620px;margin:60px auto 0;text-align:center}
.hero h1{font-size:34px;margin:0 0 12px;letter-spacing:.02em}
.hero p{color:#5f5e59;margin:0 0 6px}
.reg{margin:34px auto 0;display:flex;gap:10px;max-width:420px}
.reg input{flex:1;border:1px solid #d8d4cb;border-radius:10px;padding:11px 14px;background:#fff;outline:none}
.reg input:focus{border-color:#c9772c}
.pbtn{background:#c9772c;color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600}
.pbtn:disabled{opacity:.45;cursor:default}
.gbtn{background:#fff;border:1px solid #d8d4cb;border-radius:10px;padding:8px 16px}
.tiny{font-size:12px;color:#8a8984}
h2.sec{font-size:22px;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.tcard{background:#fff;border:1px solid #e7e4dd;border-radius:14px;padding:20px 22px;text-decoration:none;display:block;transition:border-color .2s}
.tcard:hover{border-color:#c9772c}
.tcard b{display:block;font-size:16px;margin-bottom:2px}
.tcard .u{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#8a8984}
.tcard .who{font-size:13px;color:#6b6a66;margin-top:12px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:#f1ede4;color:#7d6a4a;margin-left:8px;vertical-align:2px}
.tag.mine{background:#fbe9d6;color:#a8611f}
.panel{background:#fff;border:1px solid #e7e4dd;border-radius:14px;padding:22px 24px;margin-bottom:18px}
.panel h3{margin:0 0 12px;font-size:15px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:#8a8984}.kv dd{margin:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fa36b;margin-right:6px;box-shadow:0 0 0 3px rgba(47,163,107,.18)}
.log{font-size:13px;border-left:2px solid #ece8df;padding-left:14px}
.log p{margin:0 0 6px}
.note15{font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:15px;color:#7a6440}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f1eee7;font-size:14px}
.chk li:last-child{border-bottom:0}
.chk .b{width:20px;height:20px;border-radius:6px;border:1.5px solid #cfcabe;flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.chk li.ok .b{background:#2fa36b;border-color:#2fa36b}
.chk li.ok .t{color:#8a8984}
.chk .go{margin-left:auto;font-size:13px;color:#a8611f;text-decoration:none;white-space:nowrap}
.snaps a{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;padding:4px 10px;border:1px solid #e7e4dd;border-radius:8px;margin:0 8px 8px 0;text-decoration:none;background:#fbfaf7}
.snaps a.lv{border-color:#e7b9a0;background:#fdf2ec;color:#9a4b26}

/* toolbar */
.tb{height:42px;background:#23262b;color:#d7d9dc;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:13px;position:sticky;top:0;z-index:20}
.tb .bn{font-weight:700;color:#f0c08f;text-decoration:none;letter-spacing:.05em}
.tb .url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#30343a;border-radius:6px;padding:4px 10px;max-width:440px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb select{background:#30343a;border:1px solid #444a52;border-radius:6px;padding:3px 6px;color:#e6e7e9;font-size:12px}
.tb .warn{color:#f0b36b;font-size:12px}
.tb .sp{margin-left:auto}
.tb a.tl,.tb button.tl{background:#3a3f46;border:0;border-radius:6px;padding:4px 12px;color:#e6e7e9;text-decoration:none;font-size:12px}
.tb button.tl.fx{background:#c9772c;color:#fff}
.jump{background:#fff6e8;border-bottom:1px solid #f0dcb8;color:#7d5a2a;font-size:13px;padding:7px 18px}
.jump.red{background:#fdeeee;border-color:#f2c9c9;color:#8f3a3a}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(20,22,26,.55);z-index:60;display:grid;place-items:center;padding:24px}
.mod{background:#fff;border-radius:16px;width:min(860px,100%);max-height:90vh;overflow:auto;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mod h3{margin:0 0 4px;font-size:18px}
.mod .x{float:right;background:none;border:0;font-size:22px;color:#8a8984;line-height:1}
.rb{margin:18px 0 0}
.rrow{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid #f1eee7}
.rrow .nm{font-size:13px;color:#6b6a66;padding-top:6px}
.vers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ver{border:1.5px solid #e7e4dd;border-radius:10px;padding:8px 10px;text-align:left;background:#fbfaf7;font-size:13px;line-height:1.55}
.ver small{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#8a8984;margin-bottom:2px}
.ver.on{border-color:#c9772c;background:#fdf3e8}
.ver:disabled{cursor:not-allowed;opacity:.55}
.rfoot{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.rmsg{font-size:13px;min-height:1.5em;margin-top:10px}
.rmsg.no{color:#b5462f}.rmsg.ok{color:#2a8a5b}
.prev{background:#f7f6f2;border-radius:10px;padding:12px 14px;font-size:13px;margin-top:14px;white-space:pre-wrap;min-height:60px}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1px solid #d8d4cb;border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff}
.fin{display:flex;gap:10px;margin-top:14px}
.fin input{flex:1;border:1px solid #d8d4cb;border-radius:10px;padding:9px 12px;outline:none}

/* chat */
#chat{position:fixed;right:18px;bottom:0;width:330px;z-index:50;background:#fff;border:1px solid #d9d6ce;border-bottom:0;border-radius:12px 12px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.12);font-size:13px}
#chat .ch{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#2f6db3;color:#fff;border-radius:11px 11px 0 0;cursor:pointer;user-select:none}
#chat .ch b{font-weight:600}
#chat .ch .n{margin-left:auto;background:#e9453a;border-radius:999px;font-size:11px;padding:0 7px;min-width:18px;text-align:center}
#chat .cb{height:330px;overflow:auto;padding:10px 12px;background:#f4f6f9}
#chat.min .cb,#chat.min form{display:none}
#chat .m{margin:0 0 9px}
#chat .m .w{font-size:12px;color:#7b8794}
#chat .m .w i{font-style:normal;margin-left:6px;font-size:11px;color:#a6b0ba}
#chat .m p{margin:2px 0 0;background:#fff;border:1px solid #e3e7ec;border-radius:8px;padding:6px 9px;display:inline-block;max-width:92%;line-height:1.55;word-break:break-all}
#chat .m.me{text-align:right}
#chat .m.me p{background:#dcecff;border-color:#c8dff9;text-align:left}
#chat .m.sys{text-align:center;color:#9aa4ae;font-size:12px}
#chat form{display:flex;border-top:1px solid #e3e7ec}
#chat form input{flex:1;border:0;padding:9px 12px;outline:none;min-width:0}
#chat form button{border:0;background:#2f6db3;color:#fff;padding:0 14px}

/* ================= 青溪论坛（2009） ================= */
.bbs{font:12px/1.6 "SimSun","宋体","Songti SC",serif;color:#333;background:#e9eef2;min-height:calc(100vh - 42px);padding:10px 0 80px}
.bbs a{color:#1b4a7a;text-decoration:none}
.bbs a:hover{text-decoration:underline;color:#c00}
.wrapx{width:960px;margin:0 auto;background:#fff;border:1px solid #c5d3df}
.bh{height:92px;background:linear-gradient(#5b8fc4,#2d659e);position:relative;overflow:hidden;border-bottom:3px solid #1d4e7f}
.bh .lg{position:absolute;left:24px;top:14px;color:#fff;font:bold 34px/1 "STKaiti","KaiTi","Kaiti SC",serif;text-shadow:2px 2px 0 #163e66,0 0 12px rgba(255,255,255,.4);letter-spacing:4px}
.bh .sl{position:absolute;left:28px;top:58px;color:#d8e8f8;font-size:12px}
.bh .wv{position:absolute;right:-40px;bottom:-30px;width:420px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.bh .wv2{position:absolute;right:90px;bottom:-60px;width:300px;height:110px;border-radius:50%;background:rgba(255,255,255,.07)}
.bh .ad{position:absolute;right:20px;top:14px;width:300px;height:60px;border:1px dashed rgba(255,255,255,.5);color:rgba(255,255,255,.75);font-size:12px;display:grid;place-items:center}
.nv{background:#f1f5f8;border-bottom:1px solid #c5d3df;height:28px;line-height:28px;padding:0 12px;display:flex;gap:16px}
.nv a{font-weight:bold}
.nv .r{margin-left:auto;color:#666}
.mq{border-bottom:1px solid #e0e6eb;padding:3px 10px;color:#c00;background:#fffbe6;overflow:hidden;white-space:nowrap}
.mq span{display:inline-block;padding-left:100%;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.crumb{padding:8px 12px;color:#666}
.crumb b{color:#333}
.bx{margin:0 10px 10px;border:1px solid #c5d3df}
.bx h4{margin:0;background:linear-gradient(#e9f1f8,#d6e3ef);border-bottom:1px solid #c5d3df;padding:5px 10px;font-size:12px;color:#1b4a7a}
.bx table{width:100%;border-collapse:collapse}
.bx td,.bx th{border-bottom:1px solid #e3e9ee;padding:6px 8px;text-align:left;vertical-align:middle}
.bx th{background:#f4f7fa;font-weight:normal;color:#666}
.bx tr:last-child td{border-bottom:0}
.fi{display:flex;gap:10px;align-items:center}
.fi .ic{width:30px;height:30px;background:url() no-repeat;border-radius:3px;background:#c8d8e8;flex:none;display:grid;place-items:center;color:#2d659e;font-weight:bold}
.fi .ic.lk{background:#e8d8c8;color:#9a5a2a}
.fi b a{font-size:13px}
.fi p{margin:0;color:#777}
.num{text-align:center;color:#666;width:90px}
.lst{width:190px;color:#777}
.tl td.t a{font-size:13px}
.tl .top{color:#c00;font-weight:bold;margin-right:4px}
.tl .lock{color:#999;margin-right:4px}
.pg{padding:6px 10px;color:#666}
.post{display:grid;grid-template-columns:170px 1fr;border-bottom:4px solid #e3e9ee}
.post:last-child{border-bottom:0}
.pu{background:#f4f7fa;border-right:1px solid #e0e6eb;padding:10px}
.pu .nm{font-weight:bold;font-size:13px;display:block;margin-bottom:6px}
.pu .av{width:80px;height:80px;display:grid;place-items:center;color:#fff;font:bold 30px "KaiTi","STKaiti",serif;border:3px solid #fff;box-shadow:0 0 0 1px #c5d3df;margin-bottom:6px}
.pu dl{margin:0;color:#666;display:grid;grid-template-columns:42px 1fr;gap:1px 4px}
.pu dt{color:#999}.pu dd{margin:0}
.pc{padding:8px 14px 12px;min-width:0}
.ph{color:#999;border-bottom:1px dashed #dde3e8;padding-bottom:4px;margin-bottom:10px;display:flex;justify-content:space-between}
.ph b{color:#c00;font-weight:normal}
.pt{font-size:14px;line-height:1.9;min-height:50px;word-break:break-all}
.pt .bimg{display:inline-block;border:1px solid #ccc;background:#f3f3f3;color:#999;padding:24px 30px;margin:4px 0;font-size:12px}
.pt .blkd{color:#999;font-style:italic}
.wt{color:#fff}
.wt::selection{color:#fff;background:#3367d6}
.sg{margin-top:16px;border-top:1px dashed #c8d2db;padding-top:6px;color:#888;font-size:12px}
.fix{display:inline-block;margin-left:8px;font:12px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#c9772c;color:#fff;border-radius:4px;padding:0 6px;cursor:pointer;vertical-align:1px}
.fixed{border-bottom:1px dotted #c9772c;cursor:help}
.arc{font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff6e8;border:1px solid #f0dcb8;color:#7d5a2a;margin:0 10px 10px;padding:8px 12px;border-radius:4px}
.arc button{margin-left:8px;background:#c9772c;color:#fff;border:0;border-radius:5px;padding:2px 10px;font-size:12px}
.arc.ok{background:#eef8f1;border-color:#c5e6d1;color:#2a6b47}
.corr{color:#a9a9a9;letter-spacing:1px}
.ft{text-align:center;color:#888;padding:12px;border-top:1px solid #e0e6eb;background:#f7f9fb;line-height:2}
.ft .onl{color:#555}
.ft .onl b{color:#1b4a7a}
.pwf{margin:40px auto;width:360px;border:1px solid #c5d3df;background:#f4f7fa;padding:16px 18px}
.pwf input{border:1px solid #9fb6cc;padding:3px 6px;width:180px;font:12px "SimSun",serif}
.pwf button{font:12px "SimSun",serif;padding:2px 10px;margin-left:6px}
.sform{padding:10px 12px}
.sform input{border:1px solid #9fb6cc;padding:3px 6px;width:260px;font:12px "SimSun",serif}
.sres{padding:8px 12px;border-bottom:1px solid #e3e9ee}
.sres p{margin:2px 0;color:#555}
.sres em{color:#c00;font-style:normal}
.pop{position:fixed;z-index:70;background:#ffffe1;border:1px solid #999;font:12px "SimSun",serif;padding:4px 8px;box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.prof td:first-child{width:110px;color:#777;background:#f8fafc}
.badge-l{font:12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#9a4b26}
@media (max-width:900px){#mob{display:grid!important}}
#mob{position:fixed;inset:0;z-index:99;background:#f6f5f2;display:none;place-items:center;text-align:center;padding:30px}

body.co .am{margin-left:max(0px,calc((100vw - 1340px)/2));margin-right:360px}
body.co .wrapx{margin-left:max(10px,calc((100vw - 1320px)/2))}

/* ================= 小满的空间（2009 非主流） ================= */
.xm{min-height:calc(100vh - 42px);padding:14px 0 90px;background:#0c0710 radial-gradient(circle at 20% 30%,rgba(255,105,180,.18) 0 2px,transparent 3px) 0 0/40px 40px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.12) 0 1px,transparent 2px) 0 0/27px 27px;font:12px/1.7 "SimSun","宋体","Songti SC",serif;color:#f6d6e6}
.xm a{color:#ff8cc6;text-decoration:none}.xm a:hover{text-decoration:underline}
.xmw{width:900px;margin:0 auto;border:2px solid #ff69b4;background:rgba(20,8,20,.92);box-shadow:0 0 18px rgba(255,105,180,.45)}
body.co .xmw{margin-left:max(10px,calc((100vw - 1260px)/2))}
.xm-banner{text-align:center;padding:26px 0 4px;font:bold 40px/1.2 "STKaiti","KaiTi","Kaiti SC",serif;background:linear-gradient(90deg,#ff69b4,#fff,#ffb3d9,#ff69b4);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gl 4s linear infinite;letter-spacing:6px}
@keyframes gl{to{background-position:300% 0}}
.xm-sub{text-align:center;color:#ffb3d9;padding-bottom:16px;border-bottom:1px dashed #ff69b4;letter-spacing:2px}
.xmc{display:grid;grid-template-columns:210px 1fr;gap:12px;padding:12px}
.xmbox{border:1px dashed #ff69b4;background:rgba(255,105,180,.06);padding:9px 10px;margin-bottom:12px}
.xmbox b{color:#ff8cc6}
.xmbox p{margin:3px 0;display:flex;justify-content:space-between;gap:6px}
.xmbox p span{color:#a98ca0}
.xav{width:90px;height:90px;margin:4px auto 8px;background:#ff69b4;color:#fff;display:grid;place-items:center;font:bold 44px "KaiTi","STKaiti",serif;border:3px double #fff}
.xav.sm{width:36px;height:36px;font-size:20px;margin:0;display:inline-grid;vertical-align:middle;border-width:2px}
.xnm{display:block;text-align:center;font-size:14px}
.cnt span{font-family:"Courier New",monospace;background:#000;color:#5f5;padding:0 4px;letter-spacing:2px}
.pl{margin-top:6px}
.pt2{color:#ffb3d9;margin-bottom:4px}
.vis{display:block;width:100%;border:1px solid #ff69b4;image-rendering:pixelated}
.pc2{display:flex;gap:6px;align-items:center;margin-top:6px}
.pc2 button{background:#ff69b4;color:#fff;border:0;width:30px;height:22px;font-size:11px}
.pc2 select{background:#1a0a18;color:#ffb3d9;border:1px solid #ff69b4;font:12px "SimSun",serif;flex:1;min-width:0}
.pc2 .dl{font-size:12px}
.xfix{display:inline-block;margin-top:8px;font:12px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#c9772c;color:#fff;border:0;border-radius:4px;padding:2px 8px;cursor:pointer}
.xh{color:#ff8cc6;font:bold 16px "KaiTi","STKaiti",serif;margin:2px 0 10px;border-bottom:1px dashed #ff69b4;padding-bottom:6px}
.xh small{font:12px "SimSun",serif;color:#a98ca0}
.xd{border-bottom:1px dotted #6a3a5a;padding:10px 4px 12px}
.xdt{display:flex;gap:8px;align-items:baseline}
.xdt a,.xdt b{font-size:14px;color:#ffd1e8}
.xdt .lk{color:#ff6f6f}
.xdt .dd{margin-left:auto;color:#8a6a80;font-family:"Courier New",monospace}
.xdb{font-size:14px;line-height:1.9;margin:8px 0;color:#f6d6e6}
.xdm{color:#8a6a80}
.dlk{color:#a98ca0;font-style:italic}
.xq{border:1px dashed #ff69b4;padding:10px 12px;margin-bottom:12px;background:rgba(255,105,180,.08)}
.xq p{margin:6px 0}
.xq input{background:#1a0a18;border:1px solid #ff69b4;color:#fff;padding:2px 6px;font:12px "SimSun",serif}
.xq button{background:#ff69b4;border:0;color:#fff;font:12px "SimSun",serif;padding:2px 10px}
.xq .e{color:#ff6f6f;margin-left:8px}
.xg{border-bottom:1px dotted #6a3a5a;padding:8px 4px}
.xgh{display:flex;justify-content:space-between;color:#ff8cc6}
.xgh span{color:#8a6a80;font-family:"Courier New",monospace}
.xgb{font-size:13px;margin:4px 0}
.xgr{color:#c9a3b8;font-size:12px;border-left:2px solid #ff69b4;padding-left:6px}
.xgd{color:#7a6070;font-style:italic}
.rs{font:12px -apple-system,"PingFang SC",sans-serif;background:#2fa36b;color:#fff;border-radius:4px;padding:0 6px;margin-left:8px}
.arcx{font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff6e8;border:1px solid #f0dcb8;color:#7d5a2a;margin:0 0 12px;padding:8px 12px;border-radius:4px}
.arcx button{margin-left:8px;background:#c9772c;color:#fff;border:0;border-radius:5px;padding:2px 10px;font-size:12px}
.arcx.ok{background:#eef8f1;border-color:#c5e6d1;color:#2a6b47}
.xmf{text-align:center;color:#a98ca0;border-top:1px dashed #ff69b4;padding:10px}
.spk{position:fixed;pointer-events:none;color:#ff8cc6;font-size:12px;z-index:40;animation:spk .7s ease-out forwards}
@keyframes spk{to{transform:translateY(16px);opacity:0}}
.dlt{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.dlt td{border-bottom:1px solid #f1eee7;padding:6px 8px}

/* ================= 拾光相册（2010） ================= */

.nk{width:min(300px,92vw);background:linear-gradient(#3b3f47,#23262b);border-radius:34px 34px 46px 46px;padding:18px 18px 26px;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15)}
.nkt{text-align:center;color:#cfd3d9;font:bold 13px Arial,sans-serif;letter-spacing:4px;margin-bottom:8px}
.scr{background:#d9e4ec;border:4px solid #111;border-radius:6px;height:min(320px,82vw);display:flex;flex-direction:column;font-size:13px;color:#1a2633;overflow:hidden}
.sb{display:flex;justify-content:space-between;align-items:center;padding:2px 6px;background:#c3d2de;font:11px Arial,sans-serif}
.sig i{display:inline-block;width:3px;background:#1a2633;margin-right:1px;vertical-align:bottom}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px;opacity:.3}.sig i:nth-child(4){height:10px;opacity:.3}
.bat{display:inline-block;width:18px;height:9px;border:1px solid #1a2633;position:relative}.bat i{position:absolute;left:1px;top:1px;bottom:1px;width:3px;background:#b5462f}
.sv{flex:1;overflow:auto;position:relative}
.sk{display:flex;justify-content:space-between;padding:3px 8px;background:#1f4e79;color:#fff;font-size:12px;min-height:22px}
.boot{height:100%;display:grid;place-items:center;font:bold 26px Arial,sans-serif;letter-spacing:6px;color:#1f4e79;background:#fff}
.home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(#b9d3ea,#e4eef6)}
.home .op{font-size:12px;color:#334}.home .big{font:bold 40px Arial,sans-serif;color:#1f4e79}.home .dt{font-size:12px}.home .nt{font-size:11px;color:#b5462f;margin-top:10px}
.tt{background:#1f4e79;color:#fff;padding:3px 8px;font-size:12px;position:sticky;top:0}
.ls{list-style:none;margin:0;padding:0}
.ls li{padding:6px 8px;border-bottom:1px solid #c3d2de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ls li.on{background:#2f6db3;color:#fff}
.mv{padding:8px 10px;line-height:1.7;word-break:break-all}.mv .mh{color:#556;font-size:11px;border-bottom:1px dashed #9ab;padding-bottom:4px}
.mv .bad{color:#b5462f;font-size:12px}.mv .keys{font:bold 16px "Courier New",monospace;letter-spacing:1px;color:#1f4e79}
.pv{display:grid;place-items:center;padding:12px}.pv canvas{width:100%;image-rendering:pixelated}
.pwv{padding:12px 10px}.pwb{border:1px solid #1f4e79;background:#fff;padding:4px 8px;font:bold 16px "Courier New",monospace;min-height:28px;letter-spacing:2px}
.pwv .cur{display:inline-block;width:2px;height:16px;background:#1f4e79;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.pwv .mode{font-size:11px;color:#556;text-align:right;margin:4px 0}.pwv .e{color:#b5462f;min-height:1.4em}
.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:14px 4px 10px}
.nav>button{height:22px;border-radius:12px;border:0;background:#5a606a}
.dp{display:grid;grid-template-rows:auto auto auto;justify-items:center;gap:2px}
.dp button{width:40px;height:22px;border:0;border-radius:8px;background:#4a4f58;color:#cfd3d9;font-size:11px}.dp .ok{width:46px;height:30px;border-radius:14px;background:#6a707b}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{height:40px;border:0;border-radius:14px;background:linear-gradient(#5a606a,#41454d);color:#eef0f3;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.kp button b{font:bold 16px Arial,sans-serif}.kp button small{font-size:10px;color:#b9bfc8}
.kp button:active,.nav button:active,.dp button:active{filter:brightness(1.4)}
.wide{display:none;color:#e6e7e9;text-align:center;max-width:520px;padding:20px;font:15px/1.8 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wide a{color:#f0c08f}
.nkw.isw .nk{display:none}.nkw.isw .wide{display:block}

/* ================= 终章 ================= */
.dot.off{background:#b5462f;box-shadow:0 0 0 3px rgba(181,70,47,.18)}
.fin2{min-height:100vh;background:#1c1f24;padding:28px 20px 40px;box-sizing:border-box}
.fwrap{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1180px;margin:0 auto}
.fw{display:flex;flex-direction:column;height:calc(100vh - 110px);min-height:460px;border-radius:10px;overflow:hidden;position:relative}
.fl{background:#fff;border:1px solid #9fb6cc;font:13px/1.7 "SimSun","宋体","Songti SC",serif}
.fl .fh{background:linear-gradient(#5b8fc4,#2d659e);color:#fff}
.fr{background:#f4f6f9;border:1px solid #d9dee5;font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.fr .fh{background:#2b2f36;color:#fff}
.fh{display:flex;align-items:center;gap:10px;padding:9px 14px}
.fh span{opacity:.8;font-size:12px}.fh i{font-style:normal;font-size:11px;margin-left:auto}
.fh .lv{color:#ffd7a8}.fh .on{color:#7be0a5}
.fh .fx{background:none;border:0;color:#fff;font-size:20px;line-height:1;margin-left:6px;padding:0 4px;opacity:.85}
.fh .fx:hover{opacity:1;color:#ffb3b3}
.fb{flex:1;overflow:auto;padding:14px 16px}
.fm{margin:0 0 10px}.fm b{display:block;font-size:12px;color:#888;font-weight:normal}
.fm p{margin:2px 0 0;display:inline-block;max-width:86%;padding:7px 10px;border-radius:8px;background:#eef3f8;border:1px solid #dde6ee;word-break:break-all}
.fr .fm p{background:#fff;border-color:#e3e7ec}
.fm.me{text-align:right}.fm.me p{background:#dcecff;border-color:#c8dff9;text-align:left}
.fm.sys{text-align:center}.fm.sys p{background:none;border:0;color:#999;font-size:12px}
.fm.typ p{color:#aaa;font-style:italic}
.ff{display:flex;border-top:1px solid #dde3e8;background:#fff}
.ff input{flex:1;border:0;padding:11px 14px;outline:none;min-width:0;font:inherit}
.ff button{border:0;padding:0 18px;background:#2d659e;color:#fff}
.fr .ff button{background:#2b2f36}
.ftb{display:flex;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid #e3e7ec;background:#fff}
.ftb .warn{color:#b5462f;font-size:12px}
.fr.haunt .ff input{background:#fff3f3;color:#8f1d1d}
.fr.haunt{box-shadow:0 0 0 2px #c0392b}
.fdc{position:absolute;inset:44px 0 0 0;background:rgba(255,255,255,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#555}
.fnote{text-align:center;color:#8a8f98;font:12px -apple-system,"PingFang SC",sans-serif;margin:14px 0 0}
.endv{position:fixed;inset:0;z-index:98;background:rgba(10,11,13,.94);display:grid;place-items:center;padding:24px;animation:fade 1.2s ease}
@keyframes fade{from{opacity:0}}
.endb{max-width:560px;color:#e6e7e9;font:16px/2 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.endb .en{color:#f0c08f;letter-spacing:4px;font-size:13px}
.endb .el p{margin:0;animation:fade 1.2s ease}
.endf{margin-top:26px}.endf p{margin:0 0 6px;color:#aab}
.endf textarea{width:100%;height:70px;border-radius:8px;border:1px solid #444;background:#15171a;color:#eee;padding:8px 10px;font:14px -apple-system,"PingFang SC",sans-serif;box-sizing:border-box}
.endf button{margin-top:10px}
.endl{margin-top:22px;display:flex;gap:18px}.endl a{color:#f0c08f}

</style>
</head>

function repair(def) {
  const snaps = Object.keys(def.blocks[0].v);
  const bg = modal(`<h3>修复工具 · ${esc(def.title)}</h3><div class="tiny">对照多份快照，为每一块选出完好的版本。选错了可以撤销（<span class="kbd">Ctrl</span>+<span class="kbd">Z</span>）。</div><div class="rb"></div><div class="prev" aria-label="合成预览"></div><div class="rfoot"><button class="gbtn" data-a="auto">自动拼合</button><button class="gbtn" data-a="undo">撤销</button><button class="pbtn" data-a="ok">提交修复</button></div><div class="rmsg" role="status"></div>`);
  const rb = bg.querySelector('.rb'), prev = bg.querySelector('.prev'), msg = bg.querySelector('.rmsg');
  let pick = {}, hist = [], locked = def.forceAuto && !S.f.autoDone, mustUndo = false;
  const draw = () => {
    rb.innerHTML = '';
    def.blocks.forEach((b, i) => {
      const row = h(`<div class="rrow"><div class="nm">${esc(b.name)}</div><div class="vers"></div></div>`);
      snaps.forEach(s => { const v = b.v[s]; if (!v) return; const btn = h(`<button class="ver ${pick[i] === s ? 'on' : ''}" ${locked || mustUndo ? 'disabled' : ''}><small>快照 ${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6)}</small>${esc(v[1])}</button>`); btn.onclick = () => { hist.push({ ...pick }); pick[i] = s; msg.textContent = ''; draw(); }; row.querySelector('.vers').append(btn); });
      rb.append(row);
    });
    prev.textContent = def.blocks.map((b, i) => pick[i] ? b.v[pick[i]][1] : '（未选择）').join('\n');
    bg.querySelector('[data-a=auto]').disabled = mustUndo;
  };
  const undo = () => { if (!hist.length) { msg.textContent = '没有可以撤销的操作。'; return; } pick = hist.pop(); if (mustUndo && !hist.length) { mustUndo = false; locked = false; msg.className = 'rmsg ok'; msg.textContent = '已撤销。现在可以手动一块一块地选了。'; } else msg.textContent = '已撤销一步。'; draw(); };
  bg._key = e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } };
  bg.querySelector('[data-a=undo]').onclick = undo;
  bg.querySelector('[data-a=auto]').onclick = () => {
    hist.push({ ...pick }); const np = {}; def.blocks.forEach((b, i) => { np[i] = snaps.filter(s => b.v[s]).slice(-1)[0]; }); pick = np;
    if (def.forceAuto && !S.f.autoDone) { S.f.autoDone = 1; save(); say('老周', '自动拼合默认拿最新的那份，经常出错。你先提交看看。', 900); }
    locked = false; msg.textContent = '已按最新快照自动拼合。'; msg.className = 'rmsg'; draw();
  };
  bg.querySelector('[data-a=ok]').onclick = () => {
    if (def.blocks.some((b, i) => !pick[i])) { msg.className = 'rmsg no'; msg.textContent = '还有没选的块。'; return; }
    const bad = def.blocks.filter((b, i) => !b.v[pick[i]][0]);
    if (bad.length) {
      msg.className = 'rmsg no'; msg.textContent = `检测到损坏或乱码：${bad.map(b => b.name).join('、')}。按 Ctrl+Z 撤销，换一份快照。`;

      return;
    }
    msg.className = 'rmsg ok'; msg.textContent = '修复完成。'; setTimeout(() => { bg._close(); def.done(); }, 900);
  };
  if (locked) msg.textContent = '先点“自动拼合”试试。';
  draw();
}

function takeover(btn) {
  if (S.f.tko || document.querySelector('.tkov')) return;
  const ban = h('<div class="tkob">管理员 老林 已在另一处登录</div>'); document.body.append(ban);
  const ov = h('<div class="tkov"></div>'), gc = h('<div class="ghost"><svg viewBox="0 0 16 24" width="18" height="26"><path d="M1 1 L1 19 L5.5 14.5 L8.5 22 L11 21 L8 13.5 L14 13.5 Z" fill="#fff" stroke="#000" stroke-width="1.3"/></svg></div>');
  document.body.append(ov, gc);
  const r = btn.getBoundingClientRect();
  gc.style.left = (innerWidth / 2) + 'px'; gc.style.top = (innerHeight / 2) + 'px';
  setTimeout(() => { gc.style.left = (r.left + r.width / 2) + 'px'; gc.style.top = (r.top + r.height / 2) + 'px'; }, 900);
  // states the ghost types through, one keystroke each
  const SN = [['2011-03-15', 1], ['2012-09-30', 1], ['寻人帖 · 1 楼补录', 1]];
  const st = [{ t: NOTE1, s: SN.map(x => x[1]) }];
  let t = NOTE1.replace('是：是我', '是：不是我'); st.push({ t, s: [1, 1, 1] });
  for (let i = 0; i < 7; i++) { t = t.replace(/.。$/, '。'); st.push({ t, s: [1, 1, 1] }); }
  for (const ch of '她是自己走的。') { t += ch; st.push({ t, s: [1, 1, 1] }); }
  st.push({ t, s: [0, 1, 1] }, { t, s: [0, 0, 1] }, { t, s: [0, 0, 0] });
  let p = 0, u = 0, done = false, tail = '';
  let ed;
  const draw = () => {
    const x = st[p];
    ed.querySelector('.tkx').innerHTML = esc(x.t) + (tail ? `<br><br><span class="lin">${esc(tail)}</span>` : '') + '<span class="caret"></span>';
    ed.querySelector('.tks').innerHTML = SN.map((sn, i) => `<li class="${x.s[i] ? '' : 'gone'}">快照 ${sn[0]}　${x.s[i] ? '已存档' : '已删除'}</li>`).join('');
  };
  const flash = () => { const b = ed.querySelector('.und'); b.classList.remove('fl'); void b.offsetWidth; b.classList.add('fl'); };
  setTimeout(() => {
    ed = h(`<div class="tked" role="dialog" aria-label="修复备注编辑器"><div class="tkh">拾页修复工具 · 1 楼修复备注<b>正在编辑：老林</b></div><div class="tktb"><button class="und" tabindex="-1">撤销 Ctrl+Z</button><span>鼠标已被锁定</span></div><div class="tkx"></div><ul class="tks"></ul></div>`);
    document.body.append(ed); draw();
    document.addEventListener('keydown', key, true);
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (done) return clearInterval(iv);
      if (p < st.length - 1) { p++; draw(); flash(); }
      else { clearInterval(iv); finish(false); }
      const el = Date.now() - t0;
      if (!u && el > 6000 && !S.f.tkh1) { S.f.tkh1 = 1; save(); say('阿南', '编辑器！Ctrl+Z 能撤他的字！', 0); }
      if (!u && el > 12000 && !document.querySelector('.n15f')) { const n = n15(DATA.adm.n15.tko); n.classList.add('n15f'); document.body.append(n); }
    }, 1100);
  }, 2300);
  function key(e) {
    e.preventDefault(); e.stopPropagation();
    if (done || !(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;
    if (p > 0) { p--; u++; draw(); if (u >= 10) finish(true); }
  }
  function finish(win) {
    if (done) return; done = true;
    const end = () => {
      document.removeEventListener('keydown', key, true);
      ban.textContent = '管理员 老林 已下线'; ban.classList.add('off');
      setTimeout(() => {
        ov.remove(); gc.remove(); const n = $('.n15f'); if (n) n.remove();
        S.f.tkoWin = win ? 1 : 0; if (!win) S.f.snapDel = 1; save(); solve('tko');
        ed.querySelector('.tkh b').textContent = '老林 已离开'; ed.querySelector('.tktb span').textContent = '鼠标已解锁';
        const go = h(`<div class="tkend">${win ? '他停下了。' : '他改完，走了。'}他离开的时候，草稿箱没有关。<a href="${AURL('drafts')}">打开草稿箱</a>　<a href="${AURL('rev')}">关闭</a></div>`);
        ed.append(go);
      }, 1800);
    };
    if (!win) return setTimeout(end, 1500);
    p = 0; draw();
    let i = 0; const line = '你也在找她吗。';
    const tv = setInterval(() => { tail = line.slice(0, ++i); draw(); if (i >= line.length) { clearInterval(tv); setTimeout(end, 1500); } }, 260);
  }
}

      if (how === 'ghost') { sayF('R', FD.rFound.map(x => x.replace('{place}', place))); sayF('L', FD.lFound.map(x => x.replace('{place}', place)), () => { add('L', 'sys', '老林 已下线'); setTimeout(() => { add('R', 'sys', '十五 已下线'); show(); }, 6000); }); }
      else { sayF('L', FD.lFound.map(x => x.replace('{place}', place)), () => { add('L', 'sys', '老林 已下线'); sayF('R', FD.rFoundTold, () => { add('R', 'sys', '十五 已下线'); show(); }); }); }
    } else if (kind === 'true') {
      sayF('R', FD.rTrue, () => { add('R', 'sys', '十五 在《寻女儿林小满，求好心人》里发表了回复'); setTimeout(() => sayF('L', FD.lTrue, () => { add('L', 'sys', '本帖已被管理员锁定'); show(); }), 2500); });
    } else {
      sayF('R', F.after >= 14 ? [FD.rSink[2]] : FD.rSink, () => { add('R', 'sys', '十五 已下线'); show(); });
    }
    setStage('end');
    FD.group[kind].forEach(([w, x], j) => say(w, x, j ? 2500 : 4000));
  }
  if (F.end) endView(F.end);
}
function endView(kind) {
  if ($('.endv')) return;
  const [name, lines] = FD.end[kind], lg = legacy();
  const v = h(`<div class="endv"><div class="endb"><p class="en">结局 · ${name}</p><div class="el"></div>
    <form class="endf hid" autocomplete="off"><p>提交修复任务</p><textarea maxlength="80" placeholder="修复备注：写给下一个修这里的人（可以不写）"></textarea><button class="pbtn">提交</button></form>
    <div class="endl hid"><a href="${VURL(TODAYID, { page: 'viewthread', tid: XRT, pg: 'last' })}">去看看寻人帖</a><a href="?p=tasks">回到任务页</a><a href="#" class="rs">重新开始</a></div></div></div>`);
  document.body.append(v);
  const L = v.querySelector('.el');
  lines.forEach((x, i) => setTimeout(() => L.append(h(`<p>${esc(x)}</p>`)), 900 * (i + 1)));
  setTimeout(() => { if (S.f.submitted) v.querySelector('.endl').classList.remove('hid'); else v.querySelector('.endf').classList.remove('hid'); }, 900 * (lines.length + 1));
  v.querySelector('.endf').onsubmit = e => {
    e.preventDefault(); const note = e.target.querySelector('textarea').value.trim().replace(/[<>]/g, '');
    if (note) try { localStorage.setItem(LEG, JSON.stringify({ nick: S.nick, note, date: ymd(new Date()), end: kind })); } catch (err) { }
    S.f.submitted = 1; save();
    e.target.innerHTML = `<p>修复任务已提交。${note ? '你的备注会留给下一个修这里的人。' : ''}</p>`;
    v.querySelector('.endl').classList.remove('hid');
  };
  v.querySelector('.rs').onclick = e => { e.preventDefault(); if (!confirm('重新开始会清空这一次的进度。你留下的修复备注会留着。确定吗？')) return; try { localStorage.removeItem(SK); localStorage.removeItem(PK); } catch (err) { } location.href = FF; };
  void lg;
}
/* ======================= boot ======================= */
(function boot() {
  document.title = '拾页计划 · 中文互联网存档';
  const p = Q.get('p');
  if (p === 'phone') { pagePhone(); return; }
  if (p === 'final' && S.nick) { pageFinal(); return; }
  if (!S.nick && !(p === 'about')) { if (IS_SPACE) { location.replace(FF); return; } pageReg(); return; }
  if (IS_SPACE) spaceBoot();
  else if (Q.get('web') === 'tianya') pageTY();
  else if (Q.get('web') === 'tieba') pageTB();
  else if (Q.get('web') === 'blog') pageBlog();
  else if (Q.get('snap')) {
    if (S.stage === 'pro1') { location.replace('?p=task&id=qingxi'); return; }
    document.title = '青溪论坛 - 存档'; viewer();
  } else if (p === 'task') { if (Q.get('id') === 'xiaoman') pageTask2(); else if (Q.get('id') === 'xunren') pageTask3(); else if (Q.get('id') === 'admin') pageTask4(); else if (Q.get('id') === 'phone') pageTask5(); else pageTask(); }
  else if (p === 'about') pageAbout();
  else if (p === 'space') pageSpace();
  else pageTasks();
  chatUI(); welcomeChat();
  tick(); setInterval(tick, 5000); flush(); setInterval(flush, 400);
})();

})();
